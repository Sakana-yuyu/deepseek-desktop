<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness</title>
  <style>
    :root {
      --fg: rgb(255, 255, 255);
      --fg-dim: rgb(255, 255, 255);
      --accent: rgb(103, 158, 254);
      --accent-strong: rgb(65, 118, 230);
      --error: rgb(242, 90, 90);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: var(--fg);
    }
    body {
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      display: grid;
      place-items: center;
      -webkit-app-region: drag;
    }
    ::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }
    .hero {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 52px 64px 44px;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: none;
      border: none;
      box-shadow: none;
      animation: glass-in 800ms var(--ease-out) both;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: -6% -2%;
      z-index: -1;
      background:
        radial-gradient(ellipse 48% 42% at 50% 36%, rgba(103, 158, 254, 0.26), transparent 70%),
        radial-gradient(ellipse 58% 52% at 50% 44%, rgba(21, 21, 23, 0.58) 0%, rgba(21, 21, 23, 0.28) 46%, rgba(21, 21, 23, 0.06) 70%, transparent 84%);
      backdrop-filter: blur(20px) saturate(1.25);
      -webkit-backdrop-filter: blur(20px) saturate(1.25);
      mask-image: radial-gradient(ellipse 64% 60% at 50% 44%, #000 0%, #000 36%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse 64% 60% at 50% 44%, #000 0%, #000 36%, transparent 78%);
      pointer-events: none;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: -20% -14%;
      z-index: -2;
      background: radial-gradient(ellipse 46% 42% at 50% 38%, rgba(65, 118, 230, 0.3), transparent 72%);
      filter: blur(24px);
      pointer-events: none;
    }
    .mark {
      position: relative;
      width: 132px;
      height: 97px;
      animation: fish-in 1000ms var(--ease-out) 80ms both, fish-flash 1400ms var(--ease-out) 900ms both;
    }
    .mark svg {
      width: 100%;
      height: 100%;
      color: rgb(255, 255, 255);
      filter: drop-shadow(0 0 18px rgba(103, 158, 254, 0.55));
    }
    .wake {
      position: absolute;
      inset: 10% -16% auto;
      height: 68%;
      border: 1px solid rgba(103, 158, 254, 0.35);
      border-radius: 50%;
      animation: wake 2.6s var(--ease-out) 400ms both infinite;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.28em;
      color: rgb(255, 255, 255);
      text-shadow: 0 0 18px rgba(103, 158, 254, 0.45);
      animation: word-in 900ms var(--ease-out) 360ms both;
    }
    h1 b { font-weight: 700; }
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      padding: 3px 8px 2px 9px;
      border-radius: 99px;
      color: rgb(255, 255, 255);
      background: rgba(21, 21, 23, 0.22);
      border: none;
      box-shadow: 0 0 14px rgba(103, 158, 254, 0.18);
      animation: fade-up 700ms var(--ease-out) 560ms both;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 20px;
      animation: fade-up 700ms var(--ease-out) 720ms both;
    }
    #status {
      font-size: 13px;
      color: rgb(255, 255, 255);
      max-width: 320px;
      line-height: 1.45;
    }
    .dots { display: inline-flex; gap: 4px; }
    .dots i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgb(255, 255, 255);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: 0.18s; }
    .dots i:nth-child(3) { animation-delay: 0.36s; }
    .track {
      width: 168px;
      height: 2px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.28);
      overflow: hidden;
      animation: fade-up 700ms var(--ease-out) 840ms both;
    }
    #bar {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent-strong), var(--accent));
      box-shadow: 0 0 10px rgba(103, 158, 254, 0.7);
      transition: width 260ms var(--ease-out);
      position: relative;
    }
    #bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: translateX(-100%);
      animation: shimmer 1.6s ease-in-out infinite;
    }
    #error {
      color: var(--error);
      font-size: 12px;
      display: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      max-width: min(340px, 100%);
      max-height: 7.5em;
      overflow: hidden;
      line-height: 1.45;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
    }
    body.failed .dots,
    body.failed .track,
    body.failed .wake { display: none; }
    body.failed .hero::before {
      background: radial-gradient(ellipse 58% 52% at 50% 44%, rgba(21, 21, 23, 0.55) 0%, rgba(242, 90, 90, 0.16) 42%, transparent 78%);
    }
    body.failed .hero::after {
      background: radial-gradient(ellipse 46% 42% at 50% 38%, rgba(242, 90, 90, 0.22), transparent 72%);
    }
    @keyframes glass-in {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fish-in {
      from { opacity: 0; filter: blur(10px); transform: translateX(-8%) scale(0.9); }
      to { opacity: 1; filter: blur(0); transform: translateX(0) scale(1); }
    }
    @keyframes fish-flash {
      0%, 100% { filter: brightness(1); }
      35% { filter: brightness(1.45) drop-shadow(0 0 22px rgba(103, 158, 254, 0.9)); }
    }
    @keyframes word-in {
      from { opacity: 0; letter-spacing: 0.48em; filter: blur(6px); }
      to { opacity: 1; letter-spacing: 0.28em; filter: blur(0); }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes wake {
      0% { opacity: 0; transform: scale(0.72); }
      35% { opacity: 0.75; }
      100% { opacity: 0; transform: scale(1.35); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes shimmer {
      to { transform: translateX(100%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero, .mark, h1, .badge, .status-row, .track, .wake, .dots i, #bar::after {
        animation: none !important;
      }
    }
  </style>
</head>

    </div>
    <div class="brand">
      <h1>Deep<b>Seek</b></h1>
      <span class="badge">HARNESS</span>
    </div>
    <div class="status-row">
      <p id="status">正在准备运行环境…</p>
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <div class="track" aria-hidden="true"><span id="bar"></span></div>
    <p id="error"></p>
  </div>
  <script>
    const statusEl = document.getElementById('status')
    const barEl = document.getElementById('bar')
    const errorEl = document.getElementById('error')
    window.__DSH_SPLASH__ = {
      setStatus(text) { statusEl.textContent = text },
      setProgress(pct) { barEl.style.width = Math.min(100, Math.max(0, pct)) + '%' },
      setError(text) {
        document.body.classList.add('failed')
        errorEl.style.display = 'block'
        errorEl.textContent = text
        statusEl.textContent = '启动失败'
      },
    }
  </script>
</body>
