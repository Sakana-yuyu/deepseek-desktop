name: Desktop Release

on:
  push:
    tags:
      - desktop-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop-v* tag to rebuild and publish
        required: true
        default: desktop-v0.1.0-rc.5

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.asset_platform }}-${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset_platform: windows
            asset_arch: x64
          - runner: windows-2025
            target: i686-pc-windows-msvc
            bundles: nsis
            asset_platform: windows
            asset_arch: x86
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            asset_platform: macos
            asset_arch: x64
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            asset_platform: macos
            asset_arch: arm64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            asset_platform: linux
            asset_arch: x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build harness
        run: pnpm run build

      - name: Build desktop bundles
        run: pnpm --dir apps/desktop-tauri exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Stage release assets
        shell: pwsh
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ASSET_PLATFORM: ${{ matrix.asset_platform }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          $version = (Get-Content apps/desktop-tauri/package.json | ConvertFrom-Json).version
          $bundleRoot = "apps/desktop-tauri/src-tauri/target/$env:RUST_TARGET/release/bundle"
          New-Item -ItemType Directory -Force release-assets | Out-Null

          if ($env:ASSET_PLATFORM -eq 'windows') {
            $source = Get-ChildItem $bundleRoot -Recurse -File -Filter '*-setup.exe' | Select-Object -First 1
            if (-not $source) { throw "NSIS installer not found under $bundleRoot" }
            Copy-Item $source.FullName "release-assets/deepseek-harness-$version-windows-$env:ASSET_ARCH-setup.exe"
          }
          elseif ($env:ASSET_PLATFORM -eq 'macos') {
            $source = Get-ChildItem $bundleRoot -Recurse -File -Filter '*.dmg' | Select-Object -First 1
            if (-not $source) { throw "DMG not found under $bundleRoot" }
            Copy-Item $source.FullName "release-assets/deepseek-harness-$version-macos-$env:ASSET_ARCH.dmg"
          }
          else {
            $appImage = Get-ChildItem $bundleRoot -Recurse -File -Filter '*.AppImage' | Select-Object -First 1
            $deb = Get-ChildItem $bundleRoot -Recurse -File -Filter '*.deb' | Select-Object -First 1
            if (-not $appImage -or -not $deb) { throw "Linux AppImage or deb not found under $bundleRoot" }
            Copy-Item $appImage.FullName "release-assets/deepseek-harness-$version-linux-$env:ASSET_ARCH.AppImage"
            Copy-Item $deb.FullName "release-assets/deepseek-harness-$version-linux-$env:ASSET_ARCH.deb"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset_platform }}-${{ matrix.asset_arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        shell: pwsh
        run: |
          $expected = @(
            '*-windows-x64-setup.exe',
            '*-windows-x86-setup.exe',
            '*-macos-x64.dmg',
            '*-macos-arm64.dmg',
            '*-linux-x64.AppImage',
            '*-linux-x64.deb'
          )
          foreach ($pattern in $expected) {
            if (-not (Get-ChildItem release-assets -File -Filter $pattern)) {
              throw "Missing release asset matching $pattern"
            }
          }

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          DeepSeek Harness Desktop is a Tauri/WebView shell for the existing `dsh web` interface.

          The installer contains a trimmed Harness source tree without `node_modules`. On first launch, the app downloads the matching Node runtime and pnpm from the configured mirrors, installs production dependencies, starts the local Harness web host, and opens it in the desktop WebView.

          Included builds:
          - Windows x64 and x86 NSIS installers
          - macOS Intel and Apple Silicon DMGs
          - Linux x64 AppImage and deb packages

          These prerelease artifacts are not code-signed or notarized. Windows SmartScreen, macOS Gatekeeper, or Linux desktop security prompts may require explicit approval.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "DeepSeek Harness Desktop ${RELEASE_TAG#desktop-v}" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "DeepSeek Harness Desktop ${RELEASE_TAG#desktop-v}" --notes-file release-notes.md --prerelease
          fi
